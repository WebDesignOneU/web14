<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Showcase y ruta de aprendizaje de React + Vite + TypeScript usando la API SWAPI."
    />
    <title>Ruta de Aprendizaje · React + TypeScript (SWAPI)</title>
    <script>
      // Aplica el tema guardado antes de que React se monte, para evitar el
      // destello blanco/oscuro al cargar. El resto vive en ThemeContext.
      try {
        var saved = localStorage.getItem('web14-theme')
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
